[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar-backend"
version = "0.1.0"
description = "Avatar Local Services Marketplace API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic[email]",
    "pydantic-settings",
    "redis[asyncio]",
    "celery",
    "structlog",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart",
    "python-magic",
    "httpx",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "prometheus-fastapi-instrumentator",
    "geoalchemy2"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
